<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>남극 대탈출</title>
<style>
  :root { --bg: #0b1630; --fg: #e8f4ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9;
    border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const W = 960, H = 540, GROUND = 440, PX = 380;
const GRAV = 2200, JUMP_V = 820, JUMP2_V = 700;
const GAP_START = 260, GAP_MAX = 330, CATCH = 30;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fit(); addEventListener('resize', fit);

// ---------- storage ----------
let best = 0;
try { best = +localStorage.getItem('antarctic-escape-best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('antarctic-escape-best', String(best)); } catch (e) {} }

// ---------- sound ----------
let ac = null, muted = false;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function beep(f, dur, type = 'square', vol = 0.08, f2 = null) {
  if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + dur);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n + dur);
}
function roarSound() {
  if (!ac || muted) return;
  const n = ac.currentTime, len = 1.0;
  const buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, n); lp.frequency.linearRampToValueAtTime(150, n + len);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.5, n + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, n + len);
  src.connect(lp).connect(g).connect(ac.destination); src.start(n);
  beep(90, 0.9, 'sawtooth', 0.12, 45);
}

// ---------- state ----------
let state = 'title', time = 0, dist = 0, speed = 360, gap = GAP_START, dinoX = -400;
let obstacles = [], items = [], parts = [], texts = [];
let shake = 0, invuln = 0, nextSpawn = 500, roarTimer = 0, roarShow = 0, overTimer = 0, overReason = '';
let bgOff = 0, cocoaCount = 0, newBest = false;
const player = { y: GROUND, vy: 0, onGround: true, jumps: 0, anim: 0, falling: false };
const keys = { down: false };

const flakes = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.6, s: Math.random() * 40 + 30, w: Math.random() * 6.28 }));

function reset() {
  time = 0; dist = 0; speed = 360; gap = GAP_START; dinoX = PX - 900;
  obstacles = []; items = []; parts = []; texts = [];
  shake = 14; invuln = 0; nextSpawn = 700; roarTimer = 6; roarShow = 1.4; overTimer = 0;
  cocoaCount = 0; newBest = false;
  Object.assign(player, { y: GROUND, vy: 0, onGround: true, jumps: 0, anim: 0, falling: false });
  roarSound();
}

function rand(a, b) { return a + Math.random() * (b - a); }
function isSliding() { return keys.down && player.onGround && !player.falling && state === 'play'; }
function playerBox() {
  return isSliding() ? { x: PX - 10, y: player.y - 28, w: 58, h: 28 } : { x: PX, y: player.y - 66, w: 34, h: 66 };
}

// ---------- input ----------
function jump() {
  if (state !== 'play' || player.falling) return;
  if (player.onGround) { player.vy = -JUMP_V; player.onGround = false; player.jumps = 1; beep(520, 0.12, 'square', 0.06, 880); puff(PX + 17, GROUND, 8); }
  else if (player.jumps < 2) { player.vy = -JUMP2_V; player.jumps = 2; beep(700, 0.12, 'square', 0.05, 1200); puff(PX + 17, player.y, 6); }
}
function primary() {
  audio();
  if (state === 'title') { state = 'play'; reset(); }
  else if (state === 'over') { if (overTimer > 0.8) { state = 'play'; reset(); } }
  else jump();
}
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) primary(); }
  else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); audio(); if (!keys.down && player.onGround && state === 'play') beep(300, 0.1, 'triangle', 0.05, 150); keys.down = true; }
  else if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false; });
let slidePointer = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  if (state === 'play' && (e.clientX - r.left) < r.width * 0.4) { audio(); keys.down = true; slidePointer = e.pointerId; }
  else primary();
});
const endSlide = e => { if (e.pointerId === slidePointer) { keys.down = false; slidePointer = null; } };
cv.addEventListener('pointerup', endSlide);
cv.addEventListener('pointercancel', endSlide);
cv.addEventListener('pointerleave', endSlide);

// ---------- spawning ----------
function spawn() {
  const x = W + 60;
  const pool = ['block', 'block'];
  if (dist > 60) pool.push('crevasse');
  if (dist > 140) pool.push('tall');
  if (dist > 220) pool.push('ptero', 'ptero');
  if (dist > 500) pool.push('crevasse', 'tall');
  const type = pool[Math.floor(Math.random() * pool.length)];
  if (type === 'block') obstacles.push({ type, x, w: 52, h: 48 });
  else if (type === 'tall') obstacles.push({ type, x, w: 44, h: 92 });
  else if (type === 'crevasse') obstacles.push({ type, x, w: rand(90, Math.min(170, 110 + dist * 0.08)) });
  else if (type === 'ptero') obstacles.push({ type, x, w: 74, h: 46, y: GROUND - 100, flap: Math.random() * 6 });

  if (Math.random() < 0.4) {
    const high = Math.random() < 0.5;
    items.push({ x: x + rand(220, 340), y: high ? GROUND - 140 : GROUND - 40, bob: Math.random() * 6 });
  }
  nextSpawn = rand(1.0, 1.75) * speed * 0.85 + 160;
}

// ---------- particles ----------
function puff(x, y, n, color = '#ffffff') {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-120, 60), vy: rand(-160, -30), life: rand(0.3, 0.6), max: 0.6, r: rand(2, 5), c: color });
}
function shards(x, y) {
  for (let i = 0; i < 18; i++) parts.push({ x, y, vx: rand(-260, 260), vy: rand(-380, -60), life: rand(0.5, 0.9), max: 0.9, r: rand(3, 6), c: i % 2 ? '#bfefff' : '#ffffff', g: 1 });
}
function sparkle(x, y) {
  for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28; parts.push({ x, y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, life: 0.5, max: 0.5, r: 3, c: '#ffd76a' }); }
}
function floatText(x, y, s, c) { texts.push({ x, y, s, c, life: 1 }); }

// ---------- game logic ----------
function hit(o) {
  invuln = 1.3; gap -= 85; shake = 16;
  shards(PX + 17, player.y - 30);
  floatText(PX + 17, player.y - 90, '쿵! 공룡이 가까워졌다!', '#ff6b6b');
  beep(160, 0.25, 'sawtooth', 0.12, 60);
  if (gap > CATCH) { roarShow = 0.8; }
}
function gameOver(reason) {
  if (state !== 'play') return;
  state = 'over'; overReason = reason; overTimer = 0; shake = 20; keys.down = false;
  const m = Math.floor(dist);
  if (m > best) { best = m; newBest = true; saveBest(); }
  if (reason === 'caught') roarSound(); else beep(400, 0.8, 'triangle', 0.1, 60);
}

function update(dt) {
  time += dt;
  // snow always moves
  const wind = state === 'play' ? speed * 0.25 : 40;
  for (const f of flakes) {
    f.y += f.s * dt; f.x -= (wind * (f.r / 2.6) + Math.sin(time + f.w) * 15) * dt;
    if (f.y > H) { f.y = -5; f.x = Math.random() * W; }
    if (f.x < -5) f.x = W + 5;
  }
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ? 900 : 300) * dt; if (state === 'play') p.x -= speed * dt * 0.5; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt * 0.8; t.y -= 30 * dt; }
  texts = texts.filter(t => t.life > 0);
  shake = Math.max(0, shake - dt * 40);
  roarShow = Math.max(0, roarShow - dt);

  if (state === 'title') { bgOff += 30 * dt; return; }
  if (state === 'over') {
    overTimer += dt;
    if (overReason === 'caught') dinoX += (PX + 50 - dinoX) * Math.min(1, dt * 8);
    else { player.vy += GRAV * dt; player.y += player.vy * dt; dinoX += (PX - 60 - dinoX) * dt * 2; }
    return;
  }

  // --- play ---
  speed = Math.min(900, speed + 9 * dt);
  const dx = speed * dt;
  dist += dx / 40;
  bgOff += dx;
  invuln = Math.max(0, invuln - dt);

  // the dinosaur closes in steadily
  gap -= (5 + speed * 0.006) * dt;
  dinoX += ((PX - gap) - dinoX) * Math.min(1, dt * (dinoX < PX - 500 ? 1.6 : 5));

  roarTimer -= dt;
  if (roarTimer <= 0) { roarTimer = rand(7, 12); roarShow = 1.2; shake = 8; roarSound(); }

  nextSpawn -= dx;
  if (nextSpawn <= 0) spawn();

  for (const o of obstacles) { o.x -= dx; if (o.type === 'ptero') { o.x -= 70 * dt; o.flap += dt * 10; } }
  obstacles = obstacles.filter(o => o.x + o.w > -100);
  for (const it of items) it.x -= dx;

  // player physics
  player.anim += dt * (speed / 40);
  const footX = PX + 17;
  const overHole = obstacles.some(o => o.type === 'crevasse' && footX > o.x + 8 && footX < o.x + o.w - 8);
  if (player.falling) {
    player.vy += GRAV * dt; player.y += player.vy * dt;
    if (player.y > GROUND + 90) gameOver('crevasse');
  } else {
    player.vy += GRAV * dt * (!player.onGround && keys.down ? 2.5 : 1);
    player.y += player.vy * dt;
    if (player.y >= GROUND) {
      if (overHole) { player.falling = true; player.onGround = false; beep(600, 0.6, 'sine', 0.08, 100); floatText(PX, GROUND - 80, '으아아악!', '#9fd8ff'); }
      else {
        if (!player.onGround) puff(footX, GROUND, 6);
        player.y = GROUND; player.vy = 0; player.onGround = true; player.jumps = 0;
      }
    } else if (player.onGround && overHole) { player.onGround = false; }
    else if (player.onGround === false && player.y < GROUND) { /* airborne */ }
    if (player.onGround && Math.random() < 0.35) puff(footX - 10, GROUND, 1);
    if (isSliding() && Math.random() < 0.8) puff(PX + 40, GROUND, 1, '#e6f6ff');
  }

  // collisions
  const b = playerBox(), inset = 6;
  if (invuln <= 0 && !player.falling) {
    for (const o of obstacles) {
      if (o.type === 'crevasse' || o.hit) continue;
      const oy = o.type === 'ptero' ? o.y : GROUND - o.h;
      if (b.x + inset < o.x + o.w - inset && b.x + b.w - inset > o.x + inset && b.y + inset < oy + o.h - inset && b.y + b.h > oy + inset) {
        o.hit = true; hit(o); break;
      }
    }
  }
  for (const it of items) {
    if (it.got) continue;
    const iy = it.y + Math.sin(time * 4 + it.bob) * 6;
    if (Math.abs(it.x - (b.x + b.w / 2)) < 36 && Math.abs(iy - (b.y + b.h / 2)) < 44) {
      it.got = true; gap = Math.min(GAP_MAX, gap + 45); cocoaCount++;
      sparkle(it.x, iy); floatText(it.x, iy - 30, '+기운! 코코아', '#ffd76a');
      beep(880, 0.08, 'square', 0.06); setTimeout(() => beep(1320, 0.12, 'square', 0.06), 70);
    }
  }
  items = items.filter(it => !it.got && it.x > -60);

  if (gap <= CATCH) gameOver('caught');
}

// ---------- drawing ----------
function ridge(x, seed, amp, base) {
  return base - (Math.sin(x * 0.0031 + seed) * 0.5 + Math.sin(x * 0.0083 + seed * 2.1) * 0.32 + Math.sin(x * 0.021 + seed * 3.7) * 0.18 + 1) * amp;
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#071029'); g.addColorStop(0.55, '#1b3a6b'); g.addColorStop(1, '#7fb4dd');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // stars
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 60; i++) { const sx = (i * 157.3) % W, sy = (i * 71.7) % 200; const tw = 0.5 + 0.5 * Math.sin(time * 2 + i); ctx.globalAlpha = 0.3 + tw * 0.6; ctx.fillRect(sx, sy, 2, 2); }
  ctx.globalAlpha = 1;

  // aurora
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const bands = [['rgba(80,255,170,', 90, 0], ['rgba(140,110,255,', 130, 2], ['rgba(60,220,255,', 70, 4]];
  for (const [col, yb, ph] of bands) {
    for (let x = 0; x < W; x += 6) {
      const y = yb + Math.sin(x * 0.006 + time * 0.4 + ph) * 30 + Math.sin(x * 0.017 - time * 0.7) * 12;
      const h = 70 + Math.sin(x * 0.01 + time + ph) * 30;
      const ag = ctx.createLinearGradient(0, y - h, 0, y);
      ag.addColorStop(0, col + '0)'); ag.addColorStop(1, col + '0.16)');
      ctx.fillStyle = ag; ctx.fillRect(x, y - h, 6, h);
    }
  }
  ctx.restore();

  // far mountains
  ctx.fillStyle = '#a9c8e6';
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, ridge(x + bgOff * 0.08, 1.3, 90, GROUND - 40));
  ctx.lineTo(W, GROUND); ctx.fill();
  // near hills
  ctx.fillStyle = '#d6e9f8';
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, ridge(x + bgOff * 0.25, 4.2, 40, GROUND - 5));
  ctx.lineTo(W, GROUND); ctx.fill();

  // penguins watching from a distant floe (tiny decoration)
  const px = ((800 - bgOff * 0.25) % 2200 + 2200) % 2200 - 200;
  for (let i = 0; i < 3; i++) {
    const x = px + i * 14, y = GROUND - 30 + (i % 2) * 2;
    ctx.fillStyle = '#1b2433'; ctx.beginPath(); ctx.ellipse(x, y, 5, 9, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x + 1, y + 2, 3, 6, 0, 0, 6.28); ctx.fill();
  }
}

function drawGround() {
  const holes = obstacles.filter(o => o.type === 'crevasse').sort((a, b) => a.x - b.x);
  let x0 = 0;
  const seg = (a, b) => {
    if (b <= a) return;
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.12, '#e3f2fd'); g.addColorStop(1, '#8fb8db');
    ctx.fillStyle = g; ctx.fillRect(a, GROUND, b - a, H - GROUND);
  };
  for (const h of holes) {
    seg(x0, h.x);
    const pg = ctx.createLinearGradient(0, GROUND, 0, H);
    pg.addColorStop(0, '#2a5d8f'); pg.addColorStop(1, '#030a18');
    ctx.fillStyle = pg; ctx.fillRect(h.x, GROUND, h.w, H - GROUND);
    // icicle edges
    ctx.fillStyle = '#cdeaff';
    for (const side of [h.x, h.x + h.w]) {
      const dir = side === h.x ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(side, GROUND); ctx.lineTo(side + dir * 10, GROUND + 18); ctx.lineTo(side, GROUND + 40); ctx.lineTo(side + dir * 6, GROUND + 70); ctx.lineTo(side, H); ctx.fill();
    }
    x0 = h.x + h.w;
  }
  seg(x0, W);
  // surface sparkle dashes
  ctx.fillStyle = 'rgba(120,170,220,0.35)';
  for (let i = 0; i < 30; i++) {
    const x = ((i * 97 - bgOff) % W + W) % W, y = GROUND + 18 + (i * 37) % 70;
    if (!holes.some(h => x > h.x - 20 && x < h.x + h.w)) ctx.fillRect(x, y, 18, 2);
  }
}

function drawIce(x, y, w, h) {
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#e9fbff'); g.addColorStop(1, '#7ccbef');
  ctx.fillStyle = g; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + 8, y + 10); ctx.lineTo(x + 18, y + 6); ctx.moveTo(x + 8, y + 18); ctx.lineTo(x + 12, y + 16); ctx.stroke();
}
function drawObstacles() {
  for (const o of obstacles) {
    if (o.type === 'block') drawIce(o.x, GROUND - o.h, o.w, o.h);
    else if (o.type === 'tall') {
      drawIce(o.x, GROUND - o.h, o.w, o.h);
      // frozen fish inside
      const cx = o.x + o.w / 2, cy = GROUND - o.h / 2;
      ctx.fillStyle = 'rgba(255,140,90,0.75)';
      ctx.beginPath(); ctx.ellipse(cx, cy, 12, 6, -0.4, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx - 10, cy + 4); ctx.lineTo(cx - 18, cy + 2); ctx.lineTo(cx - 14, cy + 12); ctx.fill();
    } else if (o.type === 'ptero') drawPtero(o);
  }
}
function drawPtero(o) {
  const x = o.x, y = o.y, f = Math.sin(o.flap);
  ctx.save(); ctx.translate(x + o.w / 2, y + o.h / 2);
  ctx.fillStyle = '#7a5aa8';
  // wings
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-40, -22 * f - 4); ctx.lineTo(-20, 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(34, -22 * f - 4); ctx.lineTo(14, 6); ctx.fill();
  // body
  ctx.fillStyle = '#9677c7'; ctx.beginPath(); ctx.ellipse(0, 4, 20, 10, 0, 0, 6.28); ctx.fill();
  // head + beak (faces left, toward player)
  ctx.beginPath(); ctx.ellipse(-20, -2, 9, 8, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.moveTo(-26, -4); ctx.lineTo(-44, 2); ctx.lineTo(-26, 3); ctx.fill();
  ctx.fillStyle = '#9677c7'; ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-6, -18); ctx.lineTo(-12, -4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-22, -4, 2.6, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-23, -4, 1.3, 0, 6.28); ctx.fill();
  ctx.restore();
}
function drawItems() {
  for (const it of items) {
    const y = it.y + Math.sin(time * 4 + it.bob) * 6, x = it.x;
    ctx.save();
    ctx.fillStyle = 'rgba(255,215,106,0.25)'; ctx.beginPath(); ctx.arc(x, y, 24, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.roundRect(x - 11, y - 10, 22, 22, 4); ctx.fill();
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x + 12, y + 1, 6, -1.4, 1.4); ctx.stroke();
    ctx.fillStyle = '#6b3b1f'; ctx.fillRect(x - 9, y - 9, 18, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 11, y - 1, 22, 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * 6, y - 14); ctx.quadraticCurveTo(x + i * 6 + 5 * Math.sin(time * 5 + i), y - 22, x + i * 6, y - 30); ctx.stroke(); }
    ctx.restore();
  }
}

function drawPlayer() {
  if (state === 'over' && overReason === 'caught' && overTimer > 0.25) return;
  const sliding = isSliding();
  ctx.save(); ctx.translate(PX + 17, player.y);
  if (invuln > 0 && Math.floor(invuln * 14) % 2 === 0) ctx.globalAlpha = 0.45;
  if (state === 'over' && overReason === 'crevasse') ctx.rotate(overTimer * 6);
  ctx.lineCap = 'round';
  if (sliding) {
    ctx.strokeStyle = '#1f2d4d'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-26, -6); ctx.moveTo(-6, -14); ctx.lineTo(-24, -14); ctx.stroke();
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.roundRect(-10, -26, 34, 20, 8); ctx.fill();
    ctx.fillStyle = '#f4a261'; ctx.fillRect(-4, -32, 18, 8);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(32, -16, 12, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#f3c9a0'; ctx.beginPath(); ctx.arc(34, -16, 8, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(36, -19, 3, 3);
    ctx.strokeStyle = '#e63946'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(14, -18); ctx.lineTo(40, -4); ctx.stroke();
  } else {
    const air = !player.onGround;
    const a = air ? 0 : Math.sin(player.anim);
    // legs
    ctx.strokeStyle = '#1f2d4d'; ctx.lineWidth = 8;
    if (air) { ctx.beginPath(); ctx.moveTo(-3, -22); ctx.lineTo(-10, -8); ctx.moveTo(4, -22); ctx.lineTo(12, -10); ctx.stroke(); }
    else {
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(Math.sin(player.anim) * 14, -2 - Math.max(0, Math.cos(player.anim)) * 6);
      ctx.moveTo(0, -22); ctx.lineTo(-Math.sin(player.anim) * 14, -2 - Math.max(0, -Math.cos(player.anim)) * 6); ctx.stroke();
    }
    // back arm
    ctx.strokeStyle = '#b52a36'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(-a * 14 - (air ? 10 : 0), -34 - (air ? 14 : 0)); ctx.stroke();
    // backpack
    ctx.fillStyle = '#f4a261'; ctx.beginPath(); ctx.roundRect(-22, -56, 10, 26, 3); ctx.fill();
    // body
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.roundRect(-14, -58, 28, 38, 9); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.fillRect(-14, -36, 28, 4);
    // head
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(3, -66, 13, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#f3c9a0'; ctx.beginPath(); ctx.arc(5, -66, 8.5, 0, 6.28); ctx.fill();
    // scared face
    ctx.fillStyle = '#222'; ctx.fillRect(7, -70, 3, 4); ctx.fillRect(1, -70, 3, 4);
    ctx.beginPath(); ctx.ellipse(6, -61, 2.5, 3, 0, 0, 6.28); ctx.fill();
    // scarf
    ctx.strokeStyle = '#2a9d8f'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-6, -55); ctx.lineTo(10, -55); ctx.moveTo(-8, -55); ctx.quadraticCurveTo(-20, -56 + Math.sin(time * 18) * 4, -30, -52 + Math.sin(time * 18 + 1) * 6); ctx.stroke();
    // front arm
    ctx.strokeStyle = '#e63946'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(2, -50); ctx.lineTo(a * 14 + 4 + (air ? 8 : 0), -34 - (air ? 18 : 0)); ctx.stroke();
    // sweat drop when the dino is close
    if (gap < 120 && state === 'play') { ctx.fillStyle = '#8fd3ff'; ctx.beginPath(); ctx.ellipse(-10, -76 + (time * 30 % 10), 2.5, 4, 0, 0, 6.28); ctx.fill(); }
  }
  ctx.restore();
}

function drawDino(mx) {
  // mx = x of the snout tip. The dinosaur faces right.
  const run = state === 'title' ? 0 : time * 11;
  const bob = Math.sin(run * 2) * 4;
  const open = state === 'over' && overReason === 'caught' ? 0.1 + Math.abs(Math.sin(overTimer * 4)) * 0.3 : 0.25 + Math.abs(Math.sin(time * 3)) * 0.35 + (roarShow > 0 ? 0.4 : 0);
  ctx.save(); ctx.translate(mx, GROUND);
  const body = '#3d8b7a', dark = '#2c6b5e', belly = '#a8dccb', ice = 'rgba(210,240,255,0.85)';

  // tail
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-200, -150 + bob);
  ctx.quadraticCurveTo(-320, -150 + bob + Math.sin(run) * 10, -460, -110 + Math.sin(run) * 18);
  ctx.quadraticCurveTo(-320, -105 + bob, -200, -95 + bob); ctx.fill();

  // back leg
  const l1 = Math.sin(run), l2 = Math.sin(run + Math.PI);
  ctx.fillStyle = dark;
  ctx.save(); ctx.translate(-180, -110 + bob); ctx.rotate(l2 * 0.5);
  ctx.beginPath(); ctx.roundRect(-20, 0, 40, 80, 16); ctx.fill(); ctx.fillRect(-10, 70, 46, 16); ctx.restore();

  // body
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(-160, -140 + bob, 100, 62, -0.15, 0, 6.28); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(-130, -112 + bob, 70, 30, -0.2, 0, 6.28); ctx.fill();

  // front leg
  ctx.fillStyle = body;
  ctx.save(); ctx.translate(-140, -110 + bob); ctx.rotate(l1 * 0.5);
  ctx.beginPath(); ctx.roundRect(-22, 0, 44, 82, 16); ctx.fill(); ctx.fillRect(-12, 72, 50, 16);
  ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(26 + i * 0, 72 + i * 5); ctx.lineTo(42, 76 + i * 5); ctx.lineTo(26, 80 + i * 5); ctx.fill(); }
  ctx.restore();

  // neck
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-110, -190 + bob); ctx.lineTo(-60, -215 + bob); ctx.lineTo(-55, -160 + bob); ctx.lineTo(-90, -120 + bob); ctx.fill();

  // tiny arms
  ctx.strokeStyle = dark; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-80, -140 + bob); ctx.lineTo(-58, -128 + bob + Math.sin(run * 2) * 5); ctx.lineTo(-48, -138 + bob); ctx.stroke();

  // head (upper jaw rotates up when roaring)
  ctx.save(); ctx.translate(-80, -200 + bob);
  // lower jaw
  ctx.save(); ctx.rotate(open * 0.5);
  ctx.fillStyle = dark; ctx.beginPath(); ctx.roundRect(0, 0, 76, 20, 8); ctx.fill();
  ctx.fillStyle = '#fff'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(14 + i * 10, 2); ctx.lineTo(19 + i * 10, -8); ctx.lineTo(24 + i * 10, 2); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.rotate(-open * 0.35);
  ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(-20, -46, 100, 48, [22, 26, 10, 6]); ctx.fill();
  ctx.fillStyle = '#fff'; for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(10 + i * 10, 0); ctx.lineTo(15 + i * 10, 11); ctx.lineTo(20 + i * 10, 0); ctx.fill(); }
  // eye with angry brow
  ctx.fillStyle = '#fff6a8'; ctx.beginPath(); ctx.arc(22, -28, 9, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(25, -28, 4.5, 0, 6.28); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(8, -42); ctx.lineTo(36, -34); ctx.stroke();
  // nostril
  ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(70, -34, 3, 0, 6.28); ctx.fill();
  // frost crust on the head
  ctx.fillStyle = ice; ctx.beginPath(); ctx.moveTo(-14, -40); ctx.lineTo(10, -48); ctx.lineTo(4, -38); ctx.lineTo(-4, -44); ctx.fill();
  ctx.restore();
  ctx.restore();

  // back spikes (icy)
  ctx.fillStyle = '#bfe9ff';
  for (let i = 0; i < 6; i++) {
    const sx = -250 + i * 30, sy = -196 + bob + Math.abs(i - 3) * 6;
    ctx.beginPath(); ctx.moveTo(sx, sy + 12); ctx.lineTo(sx + 12, sy - 18); ctx.lineTo(sx + 24, sy + 12); ctx.fill();
  }
  // leftover ice chunks stuck to body (it just broke out of the ice!)
  ctx.fillStyle = ice;
  ctx.beginPath(); ctx.moveTo(-210, -170 + bob); ctx.lineTo(-180, -184 + bob); ctx.lineTo(-170, -160 + bob); ctx.lineTo(-200, -150 + bob); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-120, -100 + bob); ctx.lineTo(-96, -108 + bob); ctx.lineTo(-100, -88 + bob); ctx.fill();
  ctx.restore();

  // stomping snow
  if (state === 'play' && Math.random() < 0.5) puff(mx - 120 + rand(-30, 30), GROUND, 2);
}

function drawRoar(mx) {
  if (roarShow <= 0) return;
  const x = Math.max(70, mx - 20), y = GROUND - 280;
  ctx.save();
  ctx.font = 'bold 34px -apple-system, "Apple SD Gothic Neo", sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 6; ctx.strokeStyle = '#3a0d0d'; ctx.fillStyle = '#ff5a4e';
  const s = 1 + Math.sin(time * 40) * 0.05;
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeText('크아아앙!!', 0, 0); ctx.fillText('크아아앙!!', 0, 0);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.font = 'bold 26px -apple-system, "Apple SD Gothic Neo", sans-serif';
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
  ctx.fillText(`${Math.floor(dist)} m`, 24, 42);
  ctx.font = '16px -apple-system, "Apple SD Gothic Neo", sans-serif';
  ctx.fillStyle = '#cfe6ff';
  ctx.fillText(`최고 기록 ${best} m · 코코아 ${cocoaCount}잔`, 24, 66);
  ctx.shadowBlur = 0;

  // chase meter
  const mx = W / 2 - 160, my = 26, mw = 320, mh = 14;
  const ratio = Math.max(0, Math.min(1, (gap - CATCH) / (GAP_MAX - CATCH)));
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, 7); ctx.fill();
  ctx.fillStyle = ratio < 0.25 ? '#ff4d4d' : ratio < 0.5 ? '#ffb84d' : '#5ce1a6';
  ctx.beginPath(); ctx.roundRect(mx, my, Math.max(8, mw * ratio), mh, 7); ctx.fill();
  ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#e8f4ff';
  ctx.fillText('공룡과의 거리', W / 2, my + mh + 18);
  ctx.font = '20px sans-serif';
  ctx.fillText('🦖', mx - 16, my + 13);
  ctx.fillText('🏃', mx + mw + 16, my + 13);

  if (ratio < 0.25 && state === 'play' && Math.floor(time * 4) % 2 === 0) {
    ctx.font = 'bold 22px -apple-system, "Apple SD Gothic Neo", sans-serif'; ctx.fillStyle = '#ff6b6b';
    ctx.fillText('⚠ 위험! 코코아를 먹어 힘을 내!', W / 2, 92);
  }
  ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(232,244,255,0.7)';
  ctx.fillText(muted ? '소리 꺼짐 (M)' : '소리 켜짐 (M)', W - 20, 30);
  ctx.restore();

  // danger vignette
  if (state === 'play' && ratio < 0.4) {
    const a = (0.4 - ratio) / 0.4 * (0.35 + 0.15 * Math.sin(time * 10));
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.9);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, `rgba(200,0,0,${a})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

function panel(lines, y0) {
  ctx.save(); ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(6,16,40,0.72)'; ctx.beginPath(); ctx.roundRect(W / 2 - 300, y0, 600, lines.length * 38 + 30, 18); ctx.fill();
  let y = y0 + 48;
  for (const [txt, size, col, bold] of lines) {
    ctx.font = `${bold ? 'bold ' : ''}${size}px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    ctx.fillStyle = col; ctx.fillText(txt, W / 2, y); y += 38;
  }
  ctx.restore();
}

function drawFrozenDino() {
  // title screen: dinosaur frozen in a big ice block, cracking
  const x = 120, y = GROUND - 260, w = 260, h = 260;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.translate(Math.sin(time * 30) * (Math.sin(time * 1.3) > 0.7 ? 2 : 0), 0);
  drawDino(x + 250);
  ctx.restore();
  ctx.fillStyle = 'rgba(180,230,255,0.55)'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 150, y); ctx.lineTo(x + 140, y + 50); ctx.lineTo(x + 170, y + 80); ctx.lineTo(x + 150, y + 130);
  ctx.moveTo(x + 140, y + 50); ctx.lineTo(x + 110, y + 70); ctx.stroke();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.6, rand(-shake, shake) * 0.6);
  drawBackground();
  drawGround();

  if (state === 'title') {
    drawFrozenDino();
    player.anim += 0.08; const save = player.onGround;
    drawPlayer();
  } else {
    drawItems();
    drawObstacles();
    drawPlayer();
    drawDino(dinoX);
    drawRoar(dinoX);
  }
  // particles
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1;
  // snow
  ctx.fillStyle = '#ffffff';
  for (const f of flakes) { ctx.globalAlpha = 0.5 + f.r / 5; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1;
  // floating texts
  ctx.textAlign = 'center'; ctx.font = 'bold 18px -apple-system, "Apple SD Gothic Neo", sans-serif';
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(t.s, t.x, t.y); ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state !== 'title') drawHUD();

  if (state === 'title') {
    panel([
      ['남극 대탈출', 44, '#ffffff', true],
      ['', 10, '#fff'],
      ['얼음 속에 잠들어 있던 공룡이 깨어났다!', 20, '#cfe6ff'],
      ['잡히지 않게 최대한 멀리 도망쳐라!', 20, '#cfe6ff'],
      ['점프: 스페이스 / ↑  (공중에서 한 번 더!)   슬라이드: ↓', 16, '#9fd8ff'],
      ['모바일: 화면 오른쪽 탭 = 점프 · 왼쪽 누르기 = 슬라이드', 16, '#9fd8ff'],
      [Math.floor(time * 2) % 2 ? '▶ 스페이스 또는 화면을 눌러 시작' : '', 22, '#ffd76a', true],
    ], 70);
  } else if (state === 'over' && overTimer > 0.5) {
    panel([
      [overReason === 'caught' ? '덥석! 공룡에게 잡혔다!' : '크레바스에 빠졌다!', 36, '#ff8a80', true],
      [`달린 거리 ${Math.floor(dist)} m`, 26, '#ffffff', true],
      [newBest ? '🎉 새 최고 기록!' : `최고 기록 ${best} m`, 20, newBest ? '#ffd76a' : '#cfe6ff'],
      [overTimer > 0.8 ? '스페이스 또는 화면을 눌러 다시 도망치기' : '', 20, '#9fd8ff'],
    ], 120);
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { get state() { return state; }, get gap() { return gap; }, get dist() { return dist; } };
})();
</script>
</body>
